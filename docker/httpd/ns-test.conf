ServerName localhost

# Expose container environment variables to mod_rewrite (%{ENV:BASE}, %{ENV:LATEST}).
PassEnv BASE LATEST

# Use rewrite trace logging and send logs to container stderr/stdout.
LogLevel warn rewrite:trace3
ErrorLog /proc/self/fd/2
CustomLog /proc/self/fd/1 combined

AddDefaultCharset UTF-8
AddType text/turtle .ttl
AddType application/rdf+xml .rdf

<Directory "/usr/local/apache2/htdocs">
    AllowOverride None
    Require all granted
</Directory>

Alias /ns/ "/usr/local/apache2/htdocs/ns/"

<Directory "/usr/local/apache2/htdocs/ns">
    Options Indexes FollowSymLinks MultiViews
    AllowOverride All
    Require all granted
</Directory>